name: fork-guard
description: Fail when a fork pull_request job attempts to use repository secrets
inputs:
  has-secrets:
    description: Set to true if this job path uses any repository or org secrets beyond GITHUB_TOKEN
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Block secrets on fork pull requests
      shell: bash
      env:
        HAS_SECRETS: ${{ inputs.has-secrets }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [[ "${EVENT_NAME}" != "pull_request" ]]; then
          echo "fork-guard: not a pull_request; ok"
          exit 0
        fi
        if [[ -z "${HEAD_REPO}" ]]; then
          echo "fork-guard: missing head repo context; ok"
          exit 0
        fi
        if [[ "${HEAD_REPO}" == "${BASE_REPO}" ]]; then
          echo "fork-guard: same-repo PR; secrets allowed"
          exit 0
        fi
        if [[ "${HAS_SECRETS}" == "true" ]]; then
          echo "fork-guard: FAIL -- fork PR must not receive repository/org secrets"
          echo "head=${HEAD_REPO} base=${BASE_REPO}"
          exit 1
        fi
        echo "fork-guard: fork PR with no extra secrets; ok"
